<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arman Estimator</title>
  
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="icon" type="image/png" href="logo.png" />
  <meta name="apple-mobile-web-app-title" content="Arman Estimator" />
  <meta name="application-name" content="Arman Estimator" />

  <!-- jsPDF & AutoTable for Mobile PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --primary-green: #235c34;
      --header-bg: #d7ebd6;
      --border-color: #c0c0c0;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 12px;
      background: #f4f6f8;
      color: #222;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .btn {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .btn-primary { background: var(--primary-green); color: #fff; }
    .btn-secondary { background: #39424e; color: #fff; }
    .btn-save { background: #1f7a8c; color: #fff; }
    .btn-pdf { background: #d93025; color: #fff; font-size: 15px; padding: 12px 20px; }

    .sheet-card {
      position: relative;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-bottom: 18px;
    }
    .watermark-overlay {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      max-width: 70%;
      opacity: 0.15;
      pointer-events: none;
      z-index: 1;
    }
    .project-header {
      background: var(--header-bg);
      padding: 12px 14px;
      border-bottom: 2px solid var(--primary-green);
      position: relative;
      z-index: 2;
    }
    .project-title {
      font-size: 16px;
      font-weight: 800;
      color: #163e23;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .meta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .meta-row input {
      border: 1px solid #aaa;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 14px;
      flex: 1;
      min-width: 140px;
      background: #fff;
    }
    .table-container {
      overflow-x: auto;
      position: relative;
      z-index: 2;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 580px;
    }
    th {
      background: var(--primary-green);
      color: #fff;
      padding: 10px 8px;
      font-size: 13px;
      text-align: center;
      border: 1px solid #1c4b2b;
    }
    td {
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      font-size: 14px;
      background: transparent;
    }
    td.sl-col {
      width: 44px;
      text-align: center;
      font-weight: 700;
      color: #555;
    }
    input.cell-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      padding: 3px 0;
    }
    input.num-input {
      text-align: right;
    }
    .readonly-cell {
      text-align: right;
      font-weight: 600;
      color: #111;
    }
    .totals-row td {
      background: #eaeaea;
      font-weight: 800;
      font-size: 15px;
      border-top: 2px solid #333;
    }
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      padding: 14px;
      background: #fafafa;
      border-top: 1px solid #eee;
      position: relative;
      z-index: 2;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      z-index: 99;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 480px;
      border-radius: 8px;
      padding: 16px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .bill-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .bill-item:hover { background: #f0f7f2; }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="top-bar">
    <button class="btn btn-secondary" onclick="openSavedDrawer()">📁 Saved Bills</button>
    <div>
      <button class="btn btn-save" onclick="saveCurrentBill()">💾 Save Bill</button>
      <button class="btn btn-primary" onclick="newBlankBill()">➕ New Bill</button>
    </div>
  </div>

  <!-- Spreadsheet Card -->
  <div class="sheet-card">
    <img src="logo.png" id="watermarkImg" class="watermark-overlay" alt="Arman Interiors Watermark" onerror="this.style.display='none'" onload="this.style.display='block'" />

    <div class="project-header">
      <div class="project-title">Arman Estimator & Billing Sheet</div>
      <div class="meta-row">
        <input type="text" id="clientName" placeholder="Client Name (e.g. Gupta Residence)" />
        <input type="date" id="billDate" />
        <input type="number" id="defaultRate" placeholder="Default Rate/Ft (₹)" oninput="recalculate()" style="max-width:160px;" />
      </div>
    </div>

    <div class="table-container">
      <table id="measureTable">
        <thead>
          <tr>
            <th style="width: 44px;">SL.</th>
            <th>ITEM NAME</th>
            <th style="width: 100px;">HEIGHT (ft)</th>
            <th style="width: 100px;">WIDTH (ft)</th>
            <th style="width: 115px;">TOTAL FEET (ft)</th>
            <th style="width: 130px;">AMOUNT (₹)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot>
          <tr class="totals-row">
            <td colspan="4" style="text-align: right; padding-right: 12px;">GRAND TOTAL:</td>
            <td id="grandFeet" class="readonly-cell">0.00</td>
            <td id="grandAmount" class="readonly-cell">₹ 0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="footer-actions">
      <button class="btn btn-pdf" onclick="generateAndSharePDF()">
        <span>📄 Download / Share PDF</span>
      </button>
    </div>
  </div>

  <!-- Saved Bills Drawer -->
  <div id="savedModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0;">Saved Bills</h3>
        <button onclick="closeSavedDrawer()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div id="savedList"></div>
    </div>
  </div>

  <script>
    const defaultItems = [
      "Kitchen Top Unit",
      "Kitchen Bottom Unit",
      "MBR Wardrobe",
      "KBR Wardrobe",
      "GBR Wardrobe",
      "TV Unit",
      "Crockery Unit",
      "Shoe Unit",
      "Study Table",
      "Dressing Table",
      "", 
      "", 
      ""  
    ];

    let currentBillId = null;

    window.onload = function() {
      document.getElementById('billDate').value = new Date().toISOString().split('T')[0];
      initSheet();
    };

    function initSheet(items = defaultItems) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="sl-col">${index + 1}</td>
          <td><input type="text" class="cell-input item-name" value="${item}" placeholder="Add extra furniture..." /></td>
          <td><input type="number" step="0.01" class="cell-input num-input h-val" oninput="recalculate()" /></td>
          <td><input type="number" step="0.01" class="cell-input num-input w-val" oninput="recalculate()" /></td>
          <td class="readonly-cell ft-val">0.00</td>
          <td class="readonly-cell amt-val">0.00</td>
        `;
        tbody.appendChild(row);
      });
      recalculate();
    }

    function recalculate() {
      const rows = document.querySelectorAll('#tableBody tr');
      const rate = parseFloat(document.getElementById('defaultRate').value) || 0;
      let totalFeet = 0;
      let totalAmount = 0;

      rows.forEach(r => {
        const h = parseFloat(r.querySelector('.h-val').value) || 0;
        const w = parseFloat(r.querySelector('.w-val').value) || 0;
        
        // Addition logic: Height + Width
        const feet = (h > 0 || w > 0) ? (h + w) : 0;
        const amount = feet * rate;

        r.querySelector('.ft-val').innerText = feet > 0 ? feet.toFixed(2) : '-';
        r.querySelector('.amt-val').innerText = amount > 0 ? '₹ ' + amount.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '-';

        totalFeet += feet;
        totalAmount += amount;
      });

      document.getElementById('grandFeet').innerText = totalFeet.toFixed(2);
      document.getElementById('grandAmount').innerText = '₹ ' + totalAmount.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function collectBillData() {
      const rows = [];
      document.querySelectorAll('#tableBody tr').forEach(r => {
        const h = r.querySelector('.h-val').value;
        const w = r.querySelector('.w-val').value;
        const name = r.querySelector('.item-name').value;
        if (name && (h || w)) {
          rows.push({
            name: name,
            h: h,
            w: w,
            feet: r.querySelector('.ft-val').innerText,
            amount: r.querySelector('.amt-val').innerText
          });
        }
      });
      return {
        id: currentBillId || Date.now(),
        client: document.getElementById('clientName').value || 'Client',
        date: document.getElementById('billDate').value,
        rate: document.getElementById('defaultRate').value,
        totalFeet: document.getElementById('grandFeet').innerText,
        grandTotal: document.getElementById('grandAmount').innerText,
        items: rows
      };
    }

    function saveCurrentBill() {
      const bill = collectBillData();
      currentBillId = bill.id;
      let bills = JSON.parse(localStorage.getItem('arman_bills') || '[]');
      const index = bills.findIndex(b => b.id === bill.id);
      if (index > -1) bills[index] = bill;
      else bills.unshift(bill);
      localStorage.setItem('arman_bills', JSON.stringify(bills));
      alert('Estimate saved successfully!');
    }

    function newBlankBill() {
      if (confirm('Start a new bill? Make sure to save the current one first.')) {
        currentBillId = null;
        document.getElementById('clientName').value = '';
        document.getElementById('defaultRate').value = '';
        initSheet();
      }
    }

    function openSavedDrawer() {
      const modal = document.getElementById('savedModal');
      const list = document.getElementById('savedList');
      const bills = JSON.parse(localStorage.getItem('arman_bills') || '[]');
      list.innerHTML = bills.length === 0 ? '<p style="color:#777;">No saved estimates yet.</p>' : '';

      bills.forEach(b => {
        const item = document.createElement('div');
        item.className = 'bill-item';
        item.innerHTML = `
          <div>
            <strong>${b.client}</strong><br/>
            <small style="color:#666;">${b.date} • ${b.totalFeet} ft</small>
          </div>
          <div><strong>${b.grandTotal}</strong></div>
        `;
        item.onclick = () => loadBill(b);
        list.appendChild(item);
      });
      modal.style.display = 'flex';
    }

    function loadBill(bill) {
      currentBillId = bill.id;
      document.getElementById('clientName').value = bill.client;
      document.getElementById('billDate').value = bill.date;
      document.getElementById('defaultRate').value = bill.rate;

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      bill.items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="sl-col">${index + 1}</td>
          <td><input type="text" class="cell-input item-name" value="${item.name}" /></td>
          <td><input type="number" step="0.01" class="cell-input num-input h-val" value="${item.h}" oninput="recalculate()" /></td>
          <td><input type="number" step="0.01" class="cell-input num-input w-val" value="${item.w}" oninput="recalculate()" /></td>
          <td class="readonly-cell ft-val">${item.feet}</td>
          <td class="readonly-cell amt-val">${item.amount}</td>
        `;
        tbody.appendChild(row);
      });
      recalculate();
      closeSavedDrawer();
    }

    function closeSavedDrawer() {
      document.getElementById('savedModal').style.display = 'none';
    }

    async function generateAndSharePDF() {
      const data = collectBillData();
      if (data.items.length === 0) {
        alert("Please add measurements to at least one item before making a PDF.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });

      // Header Banner
      doc.setFillColor(35, 92, 52);
      doc.rect(0, 0, 595, 75, 'F');
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(22);
      doc.setFont("helvetica", "bold");
      doc.text("ARMAN INTERIORS", 40, 42);

      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text("ESTIMATE & BILLING SHEET", 40, 60);

      // Client Meta Info
      doc.setTextColor(40, 40, 40);
      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      doc.text(`Client: ${data.client}`, 40, 105);
      doc.text(`Date: ${data.date}`, 420, 105);
      if (data.rate) {
        doc.text(`Rate/Ft: Rs. ${data.rate}`, 40, 122);
      }

      // Items Data
      const bodyRows = data.items.map((it, idx) => [
        idx + 1,
        it.name,
        `${it.h} ft`,
        `${it.w} ft`,
        `${it.feet} ft`,
        it.amount
      ]);

      // PDF Table
      doc.autoTable({
        startY: 135,
        head: [['SL.', 'ITEM NAME', 'HEIGHT', 'WIDTH', 'TOTAL FEET', 'AMOUNT']],
        body: bodyRows,
        theme: 'grid',
        headStyles: {
          fillColor: [35, 92, 52],
          textColor: [255, 255, 255],
          fontStyle: 'bold',
          halign: 'center'
        },
        columnStyles: {
          0: { halign: 'center', cellWidth: 40 },
          1: { cellWidth: 180 },
          2: { halign: 'center' },
          3: { halign: 'center' },
          4: { halign: 'right', fontStyle: 'bold' },
          5: { halign: 'right', fontStyle: 'bold' }
        },
        styles: {
          fontSize: 10,
          cellPadding: 7
        }
      });

      // Total Footer Box
      const finalY = doc.lastAutoTable.finalY + 15;
      doc.setFillColor(240, 243, 240);
      doc.rect(40, finalY, 515, 38, 'F');
      doc.setDrawColor(35, 92, 52);
      doc.rect(40, finalY, 515, 38, 'S');

      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(35, 92, 52);
      doc.text(`GRAND TOTAL FEET: ${data.totalFeet} ft`, 55, finalY + 24);
      doc.text(`AMOUNT: ${data.grandTotal}`, 360, finalY + 24);

      // Native Device Share (WhatsApp / Drive / Save)
      const fileName = `Arman_Estimate_${data.client.replace(/\s+/g, '_')}.pdf`;
      const pdfBlob = doc.output('blob');
      const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        try {
          await navigator.share({
            files: [pdfFile],
            title: `Arman Interiors Estimate - ${data.client}`,
            text: `Estimate for ${data.client} from Arman Interiors.`
          });
        } catch (err) {
          doc.save(fileName);
        }
      } else {
        doc.save(fileName);
      }
    }
  </script>
</body>
</html>
